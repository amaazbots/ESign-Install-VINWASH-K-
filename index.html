<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Install ESign - Amaazbots</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "SF Pro Text", Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 170, 255, 0.22), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(0, 110, 255, 0.18), transparent 35%),
                #050816;
            color: white;
            overflow: hidden;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            background-image: radial-gradient(
                rgba(0, 200, 255, 0.13) 1px,
                transparent 1px
            );
            background-size: 35px 35px;
            transform: rotate(15deg);
            animation: moveBackground 25s linear infinite;
            pointer-events: none;
        }

        @keyframes moveBackground {
            from {
                transform: rotate(15deg) translate(0, 0);
            }

            to {
                transform: rotate(15deg) translate(80px, 80px);
            }
        }

        .card {
            position: relative;
            width: 430px;
            max-width: 94vw;
            max-height: 95vh;
            padding: 38px 28px 25px;
            border-radius: 30px;

            background: rgba(12, 22, 42, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            text-align: center;
            z-index: 2;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 26px;
            margin-bottom: 18px;

            filter:
                drop-shadow(0 0 15px rgba(0, 200, 255, 0.45))
                drop-shadow(0 0 35px rgba(0, 130, 255, 0.20));

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        h1 {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.62);
            font-size: 15px;
            margin-bottom: 24px;
        }

        .tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .tag {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.80);
        }

        .certificate {
            text-align: left;
            padding: 17px;
            border-radius: 19px;

            background: rgba(0, 130, 255, 0.08);
            border: 1px solid rgba(0, 190, 255, 0.17);

            margin-bottom: 18px;
        }

        .certificate-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 7px;
        }

        .certificate-name {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            color: white;
            word-break: break-word;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 9px 14px;
            border-radius: 999px;

            background: rgba(35, 205, 115, 0.10);
            border: 1px solid rgba(35, 205, 115, 0.20);

            color: #64e69b;
            font-size: 13px;
            font-weight: 700;

            margin-bottom: 18px;
        }

        .install-btn {
            width: 100%;
            border: none;
            border-radius: 17px;
            padding: 17px;

            font-size: 16px;
            font-weight: 800;
            color: white;

            background: linear-gradient(
                135deg,
                #007aff,
                #00bfff
            );

            box-shadow:
                0 12px 30px rgba(0, 150, 255, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.20);

            cursor: pointer;
            transition: 0.2s ease;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 16px 35px rgba(0, 150, 255, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .install-btn:active {
            transform: scale(0.98);
        }

        .countdown {
            margin-top: 13px;
            min-height: 18px;

            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
        }

        .footer {
            margin-top: 23px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);

            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 22px;
                border-radius: 25px;
            }

            .logo {
                width: 105px;
                height: 105px;
            }

            h1 {
                font-size: 30px;
            }

            .certificate-name {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            src="esign-logo.png"
            alt="ESign Logo"
            class="logo"
        >

        <h1>ESign</h1>

        <p class="subtitle">
            Install ESign directly on your iOS device
        </p>

        <div class="tags">
            <div class="tag">📱 iOS</div>
            <div class="tag">⚡ OTA Install</div>
            <div class="tag">🔒 Secure</div>
        </div>

        <div class="certificate">

            <div class="certificate-title">
                🔐 Certificate
            </div>

            <div class="certificate-name">
                VINWASH
            </div>

        </div>

        <div class="status">
            🟢 Ready to Install
        </div>

        <button
            class="install-btn"
            onclick="installESign()"
        >
            🚀 Install ESign
        </button>

        <div class="countdown" id="countdown">
            Preparing installation...
        </div>

        <div class="footer">
            Powered by Amaazbots
        </div>

    </div>

    <script>

        const installURL =
            "itms-services://?action=download-manifest&url=https://website.khoindvn.io.vn/plists/kjjenffojofo.plist";

        function installESign() {
            window.location.href = installURL;
        }

        let seconds = 5;

        const countdown =
            document.getElementById("countdown");

        const timer = setInterval(() => {

            seconds--;

            if (seconds > 0) {

                countdown.textContent =
                    "Installation will begin in " +
                    seconds +
                    " seconds...";

            } else {

                clearInterval(timer);

                countdown.textContent =
                    "Opening installation...";

                installESign();
            }

        }, 1000);

    </script>

</body>
</html>
